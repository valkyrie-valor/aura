name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version from Git tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "${VERSION%%-*}"
          VERSION_CODE=$(( ${MAJOR:-1} * 10000 + ${MINOR:-0} * 100 + ${PATCH:-0} ))
          APK_NAME="Aura-v${VERSION}.apk"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "apk_name=${APK_NAME}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | tr -d '\n\r ' | base64 -d > keystore.jks

      - name: Build signed release APK
        run: |
          ./gradlew assembleRelease \
            -PversionName="${{ steps.version.outputs.version }}" \
            -PversionCode="${{ steps.version.outputs.version_code }}" \
            -Pandroid.injected.signing.store.file="${GITHUB_WORKSPACE}/keystore.jks" \
            -Pandroid.injected.signing.store.password="${{ secrets.STORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD }}"

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk "${{ steps.version.outputs.apk_name }}"
          mv app/build/outputs/apk/release/app-release.apk aura-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.version.outputs.apk_name }}
            aura-release.apk
          generate_release_notes: true

      - name: Upload APK to Nexus raw repo
        run: |
          EXISTING_IDS=$(curl -fsSL \
            -u "${{ secrets.NEXUS_USERNAME }}:${{ secrets.NEXUS_PASSWORD }}" \
            "https://nexus.coolifyapp.chriga.me/service/rest/v1/search/assets?repository=raw" \
            | jq -r '.items[] | select(.path | test("^/?apks/aura/.*\\.apk$"; "i")) | .id' || true)
          for id in $EXISTING_IDS; do
            curl -fsSL -X DELETE \
              -u "${{ secrets.NEXUS_USERNAME }}:${{ secrets.NEXUS_PASSWORD }}" \
              "https://nexus.coolifyapp.chriga.me/service/rest/v1/assets/$id" || true
          done
          curl -fsSL \
            -u "${{ secrets.NEXUS_USERNAME }}:${{ secrets.NEXUS_PASSWORD }}" \
            --upload-file "${{ steps.version.outputs.apk_name }}" \
            "https://nexus.coolifyapp.chriga.me/repository/raw/apks/aura/${{ steps.version.outputs.apk_name }}"

      - name: Remove keystore
        if: always()
        run: rm -f keystore.jks
